<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almanac</title>
<!-- Your site stylesheet. Change the path if it lives somewhere else. -->
<link rel="stylesheet" href="style.css">
<style>
  .game-wrap { max-width: 760px; margin: 0 auto; padding: 0 20px 48px; font-family: var(--font-primary); }
  .game-intro { text-align: center; margin: 18px auto 6px; max-width: 560px; line-height: 1.55; opacity: 0.85; }

  /* Score strip */
  .scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0 6px; }
  .score {
    background-color: var(--bg-cream-dark); border: 1px solid var(--accent-sage); border-radius: 8px;
    padding: 10px 6px; text-align: center;
  }
  .score b { display: block; font-size: 1.6rem; line-height: 1.1; color: var(--bg-forest-light); font-variant-numeric: tabular-nums; }
  .score span { font-size: 0.78rem; letter-spacing: 0.5px; opacity: 0.8; }

  .panel {
    background-color: var(--bg-cream-dark); border: 1px solid var(--accent-sage); border-radius: 12px;
    padding: 20px; margin-top: 18px;
  }
  .panel h2 { margin: 0 0 12px; color: var(--accent-sage); font-size: 1.25rem; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .label { font-size: 0.85rem; font-weight: bold; letter-spacing: 0.5px; opacity: 0.75; margin: 14px 0 6px; }

  .btn {
    font-family: var(--font-primary); font-weight: bold; font-size: 0.95rem; cursor: pointer;
    color: var(--bg-cream); background-color: var(--bg-forest); border: 1px solid var(--bg-forest-light);
    border-radius: 6px; padding: 9px 16px; transition: all 0.15s ease-in-out;
  }
  .btn:hover:not(:disabled) { background-color: var(--bg-forest-light); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.ghost { background: none; color: var(--bg-forest); border-color: var(--accent-sage); }
  .btn.ghost:hover:not(:disabled) { background-color: var(--bg-cream); color: var(--bg-forest); }
  .diff { flex: 1; min-width: 120px; background: none; color: var(--bg-forest); border: 2px solid var(--accent-sage); padding: 10px 12px; }
  .diff small { display: block; font-weight: normal; font-size: 0.75rem; opacity: 0.75; }
  .diff[aria-pressed="true"] { background-color: var(--bg-forest); color: var(--bg-cream); border-color: var(--bg-forest); }
  .diff:hover:not([aria-pressed="true"]) { background-color: var(--bg-cream); }
  select.pick {
    font-family: var(--font-primary); font-size: 0.95rem; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--accent-sage); background-color: var(--bg-cream); color: var(--bg-forest); min-width: 150px;
  }

  /* The almanac line */
  .card { text-align: center; padding: 26px 20px 22px; }
  .card .team { font-size: 1.15rem; letter-spacing: 1px; opacity: 0.85; }
  .card .initials { font-size: 4.2rem; font-weight: bold; letter-spacing: 6px; line-height: 1.1; margin: 6px 0 2px; color: var(--bg-forest); }
  .card .tier { display: inline-block; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--accent-sage); }

  /* Three clue spaces */
  .clues { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; align-items: start; }
  .slot {
    font-family: var(--font-primary); border-radius: 8px; min-height: 78px;
    background-color: var(--bg-cream); color: var(--bg-forest); border: 2px dashed var(--accent-sage);
  }
  .slot .q { display: block; font-size: 0.8rem; font-weight: bold; letter-spacing: 0.5px; opacity: 0.7; }
  .slot .a { display: block; font-size: 1.15rem; font-weight: bold; margin-top: 2px; }
  .slot-open-btn {
    width: 100%; min-height: 74px; padding: 12px 14px; text-align: left; cursor: pointer;
    font-family: var(--font-primary); background: none; border: 0; color: inherit; border-radius: 6px;
  }
  .slot-open-btn .a { opacity: 0.55; font-size: 1rem; font-weight: normal; }
  .slot:hover:not(.revealed):not(.open) { border-style: solid; }
  .slot.open { border-style: solid; border-color: var(--bg-forest-light); }
  .slot.revealed { border-style: solid; border-color: var(--bg-forest-light); padding: 12px 14px; }
  .picker { padding: 10px; }
  .picker .q { margin: 0 0 6px 4px; }
  .opt {
    display: block; width: 100%; text-align: left; cursor: pointer; margin-bottom: 4px;
    font-family: var(--font-primary); font-size: 0.98rem; padding: 7px 10px; border-radius: 5px;
    background: none; color: inherit; border: 1px solid transparent;
  }
  .opt:hover { border-color: var(--accent-sage); }
  .opt[aria-checked="true"] { background-color: var(--bg-forest); color: var(--bg-cream); font-weight: bold; }
  .opt[aria-checked="true"]::after { content: '  ↵'; opacity: 0.7; }
  .picker .reveal { width: 100%; margin-top: 4px; padding: 7px 10px; }
  .clues-left { text-align: center; font-size: 0.9rem; margin-top: 10px; opacity: 0.8; }

  .guess-row { display: flex; gap: 10px; margin-top: 18px; }
  .guess-row input {
    flex: 1; min-width: 0; font-family: var(--font-primary); font-size: 1.05rem; padding: 10px 14px;
    border-radius: 6px; border: 2px solid var(--accent-sage); background-color: var(--bg-cream); color: var(--bg-forest);
  }
  .guess-row input:focus { outline: none; border-color: var(--bg-forest-light); }
  .note { min-height: 1.3em; margin-top: 8px; font-size: 0.92rem; text-align: center; }

  .result { text-align: center; }
  .result .verdict { font-size: 1.5rem; font-weight: bold; margin: 0 0 4px; }
  .result .verdict.win { color: var(--bg-forest-light); }
  .result .name { font-size: 1.9rem; font-weight: bold; margin: 4px 0 12px; }
  .line { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 auto 16px; max-width: 520px; }
  .line div { background-color: var(--bg-cream); border: 1px solid var(--accent-sage); border-radius: 6px; padding: 8px 4px; }
  .line small { display: block; font-size: 0.72rem; opacity: 0.7; letter-spacing: 0.5px; }
  .line b { font-size: 1rem; }

  .history { margin-top: 22px; }
  .history h2 { color: var(--accent-sage); font-size: 1.15rem; margin: 0 0 8px; }
  .history ol { list-style: none; margin: 0; padding: 0; }
  .history li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid rgba(142, 184, 151, 0.45); font-size: 0.95rem; }
  .history li:last-child { border-bottom: 0; }
  .history .ok { color: var(--bg-forest-light); font-weight: bold; }
  .history .miss { opacity: 0.7; }
  .reset { display: block; margin: 14px auto 0; font-size: 0.85rem; }
  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    .scores { grid-template-columns: repeat(2, 1fr); }
    .card .initials { font-size: 3.4rem; }
    .clues { grid-template-columns: 1fr; }
    .line { grid-template-columns: repeat(2, 1fr); }
    .guess-row { flex-wrap: wrap; }
    .guess-row input { flex: 1 1 100%; }
    .guess-row .btn { flex: 1; }
  }

  @media (prefers-color-scheme: dark) {
    .score, .panel { background-color: rgba(255, 255, 255, 0.05); border-color: var(--bg-forest-light); }
    .score b, .result .verdict.win, .history .ok { color: var(--accent-sage); }
    .btn { background-color: var(--bg-cream); color: var(--bg-forest); border-color: var(--bg-cream-dark); }
    .btn:hover:not(:disabled) { background-color: var(--bg-cream-dark); }
    .btn.ghost, .diff { background: none; color: var(--bg-cream); border-color: var(--bg-forest-light); }
    .btn.ghost:hover:not(:disabled), .diff:hover:not([aria-pressed="true"]) { background-color: rgba(255, 255, 255, 0.08); color: var(--bg-cream); }
    .diff[aria-pressed="true"] { background-color: var(--accent-sage); color: var(--bg-forest); border-color: var(--accent-sage); }
    select.pick, .slot, .guess-row input, .line div { background-color: var(--bg-forest); color: var(--bg-cream); border-color: var(--bg-forest-light); }
    .slot.open, .slot.revealed { border-color: var(--accent-sage); }
    .opt[aria-checked="true"] { background-color: var(--accent-sage); color: var(--bg-forest); }
    .card .initials { color: var(--bg-cream); }
    .history li { border-bottom-color: rgba(142, 184, 151, 0.2); }
  }
</style>
    <link rel="icon" type="image/png" href="images/navigation/favicon.png">
</head>
<body>
<header class="sticky-header">
  <a class="back-btn" href="games.html">← Back</a>
  <h1>Almanac</h1>
</header>

<main class="game-wrap">
  <p class="game-intro">Pick a difficulty and get a team, a year, and a player's initials. Fill up to three clue spaces, then name the player.</p>

  <div class="scores">
    <div class="score"><b id="s-points">0</b><span>Points</span></div>
    <div class="score"><b id="s-record">0–0</b><span>Right–Wrong</span></div>
    <div class="score"><b id="s-streak">0</b><span>Streak</span></div>
    <div class="score"><b id="s-best">0</b><span>Best streak</span></div>
  </div>

  <!-- Setup -->
  <section class="panel" id="setup">
    <h2>New player</h2>
    <div class="label">Difficulty</div>
    <div class="row" role="group" aria-label="Difficulty">
      <button class="btn diff" data-tier="E" aria-pressed="false">Easy<small>Regulars · 1 point</small></button>
      <button class="btn diff" data-tier="M" aria-pressed="true">Medium<small>Role players · 2 points</small></button>
      <button class="btn diff" data-tier="H" aria-pressed="false">Hard<small>Deep cuts · 3 points</small></button>
    </div>
    <div class="label">Narrow it down (optional)</div>
    <div class="row">
      <select class="pick" id="pick-year" aria-label="Season"></select>
      <select class="pick" id="pick-team" aria-label="Team"></select>
      <button class="btn" id="deal" style="margin-left:auto">Deal a player</button>
    </div>
    <p class="note" id="setup-note"></p>
  </section>

  <!-- Round -->
  <section class="panel" id="round" hidden>
    <div class="card">
      <div class="team" id="r-team"></div>
      <div class="initials" id="r-initials"></div>
      <span class="tier" id="r-tier"></span>
    </div>
    <div class="clues" id="clues"></div>
    <p class="clues-left" id="clues-left"></p>
    <form class="guess-row" id="guess-form" autocomplete="off">
      <input id="guess" type="text" placeholder="Who is it?" spellcheck="false" aria-label="Your guess">
      <button class="btn" type="submit">Guess</button>
      <button class="btn ghost" type="button" id="give-up">Give up</button>
    </form>
    <p class="note" id="round-note" aria-live="polite"></p>
  </section>

  <!-- Result -->
  <section class="panel result" id="result" hidden>
    <p class="verdict" id="v-verdict"></p>
    <div class="team" id="v-team"></div>
    <div class="name" id="v-name"></div>
    <div class="line" id="v-line"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="next">Next player</button>
      <button class="btn ghost" id="change">Change settings</button>
    </div>
  </section>

  <section class="history" id="history" hidden>
    <h2>This session</h2>
    <div class="panel" style="padding:4px 0; margin-top:0"><ol id="history-list"></ol></div>
  </section>
  <button class="btn ghost reset" id="reset">Reset score</button>
</main>

<script src="data/mlb-guess.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CLUES_ALLOWED = 3;
  const POINTS = { E: 1, M: 2, H: 3 };
  const TIER_NAME = { E: 'Easy', M: 'Medium', H: 'Hard' };
  const POSITIONS = {
    C: 'Catcher', '1B': 'First base', '2B': 'Second base', '3B': 'Third base', SS: 'Shortstop',
    LF: 'Left field', CF: 'Center field', RF: 'Right field', OF: 'Outfield', DH: 'Designated hitter',
    SP: 'Starting pitcher', RP: 'Relief pitcher', TWP: 'Two-way player', IF: 'Infield', UT: 'Utility',
  };
  const HANDS = { R: 'Right', L: 'Left', S: 'Switch' };
  const isPitcher = p => p.position === 'SP' || p.position === 'RP';

  const data = window.MLB_GUESS_DATA;
  if (!data) {
    $('setup-note').textContent = "No player data yet. Run  node build-mlb-guess.mjs  in this folder first.";
    $('deal').disabled = true;
    return;
  }
  const players = data.players.map(row => Object.fromEntries(data.fields.map((f, i) => [f, row[i]])));
  const teamInfo = (season, id) => data.teamNames?.[season]?.[id] ?? { name: 'Unknown', full: 'Unknown' };

  // ---------- Score (kept in this browser only) ----------
  let score = { points: 0, right: 0, wrong: 0, streak: 0, best: 0 };
  try { score = { ...score, ...JSON.parse(localStorage.getItem('almanac-score') || '{}') }; } catch {}
  const saveScore = () => { try { localStorage.setItem('almanac-score', JSON.stringify(score)); } catch {} };
  function drawScore() {
    $('s-points').textContent = score.points;
    $('s-record').textContent = `${score.right}–${score.wrong}`;
    $('s-streak').textContent = score.streak;
    $('s-best').textContent = score.best;
  }
  drawScore();
  $('reset').onclick = () => { score = { points: 0, right: 0, wrong: 0, streak: 0, best: 0 }; saveScore(); drawScore(); };

  // ---------- Setup ----------
  let tier = 'M';
  try { tier = localStorage.getItem('almanac-tier') || 'M'; } catch {}
  const setTier = t => {
    tier = t;
    document.querySelectorAll('.diff').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tier === t)));
    try { localStorage.setItem('almanac-tier', t); } catch {}
  };
  setTier(tier);
  document.querySelectorAll('.diff').forEach(b => b.onclick = () => setTier(b.dataset.tier));

  const seasons = [...new Set(players.map(p => p.season))].sort((a, b) => b - a);
  $('pick-year').innerHTML = '<option value="">Any year</option>' + seasons.map(s => `<option>${s}</option>`).join('');
  function fillTeams() {
    const yr = $('pick-year').value;
    const names = new Map();
    for (const s of yr ? [yr] : seasons) {
      for (const t of Object.values(data.teamNames?.[s] ?? {})) if (!names.has(t.name)) names.set(t.name, t.full);
    }
    const keep = $('pick-team').value;
    $('pick-team').innerHTML = '<option value="">Any team</option>' +
      [...names.keys()].sort().map(n => `<option${n === keep ? ' selected' : ''}>${esc(n)}</option>`).join('');
  }
  fillTeams();
  $('pick-year').onchange = fillTeams;

  // ---------- Round ----------
  let current = null, done = false;
  let slots = [null, null, null];    // each filled slot: the clue kind asked there
  let openSlot = null, pickIdx = 0;  // which slot's question list is open, and the highlighted question
  const recent = [];   // avoid repeating the same player-season soon

  function deal() {
    const yr = $('pick-year').value, team = $('pick-team').value;
    let pool = players.filter(p => p.tier === tier &&
      (!yr || String(p.season) === yr) &&
      (!team || teamInfo(p.season, p.team).name === team));
    if (!pool.length) {
      $('setup-note').textContent = 'No players match those settings. Try another year, team or difficulty.';
      return;
    }
    const fresh = pool.filter(p => !recent.includes(p));
    if (fresh.length) pool = fresh;
    current = pool[Math.floor(Math.random() * pool.length)];
    recent.push(current); if (recent.length > 200) recent.shift();
    slots = [null, null, null]; openSlot = null; done = false;

    const t = teamInfo(current.season, current.team);
    $('r-team').textContent = `${current.season} ${t.full}`;
    $('r-initials').textContent = `${current.first[0]}${current.last[0]}`.toUpperCase();
    $('r-tier').textContent = `${TIER_NAME[current.tier]} · ${POINTS[current.tier]} pt${POINTS[current.tier] > 1 ? 's' : ''}`;
    drawSlots();
    $('guess').value = '';
    $('round-note').textContent = '';
    drawCluesLeft();
    $('setup').hidden = true; $('result').hidden = true; $('round').hidden = false;
    $('setup-note').textContent = '';
    $('round').scrollIntoView({ block: 'nearest' });
  }

  function clueText(kind, p) {
    if (kind === 'position') return POSITIONS[p.position] ?? p.position;
    if (kind === 'hand') return isPitcher(p) ? `Throws ${HANDS[p.hand] ?? p.hand}` : `Bats ${HANDS[p.hand] ?? p.hand}`;
    if (kind === 'age') return p.age ?? '—';
    if (kind === 'games') return p.games;
  }
  const CLUE_NAMES = { position: 'Position', hand: 'Handedness', age: 'Age', games: 'Games played' };
  const unasked = () => Object.keys(CLUE_NAMES).filter(k => !slots.includes(k));

  function drawCluesLeft() {
    const left = slots.filter(s => !s).length;
    $('clues-left').textContent = left > 0 ? `${left} clue${left === 1 ? '' : 's'} left` : 'No clues left. Make your guess.';
  }

  // Draw the three clue spaces: empty, choosing a question, or revealed.
  function drawSlots() {
    const choices = unasked();
    $('clues').innerHTML = slots.map((kind, i) => {
      if (kind) {
        return `<div class="slot revealed"><span class="q">${CLUE_NAMES[kind]}</span><span class="a">${esc(clueText(kind, current))}</span></div>`;
      }
      if (i === openSlot) {
        return `<div class="slot open"><div class="picker" role="radiogroup" aria-label="Clue ${i + 1}: choose a question">
          <span class="q">Clue ${i + 1}: ask for…</span>
          ${choices.map((k, j) => `<button type="button" class="opt" role="radio" data-kind="${k}" aria-checked="${j === pickIdx}" tabindex="${j === pickIdx ? 0 : -1}">${CLUE_NAMES[k]}</button>`).join('')}
          <button type="button" class="btn reveal">Reveal</button>
        </div></div>`;
      }
      return `<div class="slot"><button type="button" class="slot-open-btn" data-slot="${i}">
        <span class="q">Clue ${i + 1}</span><span class="a">Click to choose</span></button></div>`;
    }).join('');
    drawCluesLeft();
    if (openSlot !== null) $('clues').querySelector('.opt[aria-checked="true"]')?.focus();
  }

  function openPicker(i) { if (done) return; openSlot = i; pickIdx = 0; drawSlots(); }
  function closePicker() { openSlot = null; drawSlots(); }
  function revealPicked() {
    const kind = unasked()[pickIdx];
    if (openSlot === null || !kind) return;
    slots[openSlot] = kind;
    openSlot = null;
    drawSlots();
    if (slots.every(Boolean)) $('guess').focus();
    else $('clues').querySelector('.slot-open-btn')?.focus();
  }

  $('clues').addEventListener('click', e => {
    const open = e.target.closest('.slot-open-btn');
    if (open) return openPicker(+open.dataset.slot);
    const opt = e.target.closest('.opt');
    if (opt) { pickIdx = unasked().indexOf(opt.dataset.kind); return drawSlots(); }
    if (e.target.closest('.reveal')) revealPicked();
  });
  $('clues').addEventListener('keydown', e => {
    if (openSlot === null) return;
    const n = unasked().length;
    if (['ArrowDown', 'ArrowRight'].includes(e.key)) { e.preventDefault(); pickIdx = (pickIdx + 1) % n; drawSlots(); }
    else if (['ArrowUp', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); pickIdx = (pickIdx - 1 + n) % n; drawSlots(); }
    else if (e.key === 'Enter') { e.preventDefault(); revealPicked(); }
    else if (e.key === 'Escape') { e.preventDefault(); closePicker(); }
  });
  // Clicking anywhere else closes an open question list.
  document.addEventListener('click', e => { if (openSlot !== null && !e.target.closest('.slot')) closePicker(); });

  // ---------- Guessing ----------
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[.'’]/g, '').replace(/-/g, ' ').replace(/\b(jr|sr|ii|iii|iv)\b/g, '').replace(/\s+/g, ' ').trim();
  function distance(a, b) {   // how many letters differ (typos)
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function judge(guess, p) {
    const g = norm(guess);
    const answers = [...new Set([norm(p.name), norm(`${p.first} ${p.last}`)])];
    if (answers.includes(g)) return 'right';
    const lastOnly = norm(p.last);
    if (g === lastOnly) return 'last-only';
    const allowed = g.length > 10 ? 2 : 1;
    if (answers.some(a => distance(g, a) <= allowed)) return 'close';
    return 'wrong';
  }

  $('guess-form').onsubmit = e => {
    e.preventDefault();
    if (done) return;
    const guess = $('guess').value.trim();
    if (!guess) { $('round-note').textContent = 'Type a name first.'; return; }
    const verdict = judge(guess, current);
    if (verdict === 'last-only') { $('round-note').textContent = 'Right last name. Add the first name to lock it in.'; return; }
    finish(verdict === 'right' || verdict === 'close', guess, verdict === 'close');
  };
  $('give-up').onclick = () => { if (!done) finish(false, null, false); };

  function finish(won, guess, close) {
    done = true;
    const p = current;
    if (won) { score.points += POINTS[p.tier]; score.right++; score.streak++; score.best = Math.max(score.best, score.streak); }
    else { score.wrong++; score.streak = 0; }
    saveScore(); drawScore();

    const t = teamInfo(p.season, p.team);
    $('v-verdict').textContent = won ? `Correct! +${POINTS[p.tier]}` + (close ? ' (close enough)' : '') : guess ? `Not quite. You said ${guess}.` : 'The answer was';
    $('v-verdict').className = 'verdict' + (won ? ' win' : '');
    $('v-team').textContent = `${p.season} ${t.full}`;
    $('v-name').textContent = p.name;
    const hand = isPitcher(p) ? `Throws ${HANDS[p.hand] ?? p.hand}` : `Bats ${HANDS[p.hand] ?? p.hand}`;
    $('v-line').innerHTML = [
      ['Position', POSITIONS[p.position] ?? p.position], ['Handedness', hand], ['Age', p.age ?? '—'], ['Games', p.games],
    ].map(([k, v]) => `<div><small>${k}</small><b>${esc(v)}</b></div>`).join('');

    $('history').hidden = false;
    $('history-list').insertAdjacentHTML('afterbegin',
      `<li><span>${p.season} ${esc(t.name)} ${esc(p.first[0] + p.last[0])} · <b>${esc(p.name)}</b></span>` +
      `<span class="${won ? 'ok' : 'miss'}">${won ? `+${POINTS[p.tier]}` : '✗'}</span></li>`);

    $('round').hidden = true; $('result').hidden = false;
    $('next').focus();
  }

  $('deal').onclick = deal;
  $('next').onclick = deal;
  $('change').onclick = () => { $('result').hidden = true; $('setup').hidden = false; };
})();
</script>
</body>
</html>
