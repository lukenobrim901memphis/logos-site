<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIDOM Roster Trackers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lidom-roster-style.css">
    <link rel="icon" type="image/png" href="images/navigation/favicon.png">
</head>
<body>
  <a href="trackers.html" class="back-btn">← Back to Trackers</a>
    <nav>
        <h1>LIDOM Roster Trackers</h1>
    </nav>

    <div class="filter-buttons">
        <button class="filter-btn text-aguilas" onclick="loadRoster('aguilas')">Águilas Cibaeñas</button>
        <button class="filter-btn text-estrellas" onclick="loadRoster('estrellas')">Estrellas Orientales</button>
        <button class="filter-btn text-gigantes" onclick="loadRoster('gigantes')">Gigantes del Cibao</button>
        <button class="filter-btn text-leones" onclick="loadRoster('leones')">Leones del Escogido</button>
        <button class="filter-btn text-tigres" onclick="loadRoster('tigres')">Tigres del Licey</button>
        <button class="filter-btn text-toros" onclick="loadRoster('toros')">Toros del Este</button>
    </div>
</div>

        <table class="roster-table" id="main-roster-table">
            <thead>
                <tr id="table-header-row">
                    <th>No.</th>
                    <th>Pos.</th>
                    <th>Name</th>
                    <th>B/T</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="roster-body"></tbody>
        </table>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</body>
<script src="lidom-tracker-logic.js"></script>
</html>
