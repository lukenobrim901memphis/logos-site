<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fresno Grizzlies Logo History</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../triple-a-style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../navigation/favicon.png">
</head>
<body>
    <header class="sticky-header">
    <a href="../../triple-a.html" class="back-btn">← Back to Triple-A</a>
    <h1 class="text-grizzlies">Fresno Grizzlies</h1>
</header>

    <div class="category-header">Primary Logos</div>
    <div id="primary-logos" class="grid"></div>

    <div class="category-header">Alternate Logos</div>
    <div id="alternate-logos" class="grid"></div>

    <div class="category-header">Hat Logos</div>
    <div id="hat-logos" class="grid"></div>

    <div class="category-header">Jersey Logos</div>
    <div id="jersey-logos" class="grid"></div>

    <div class="category-header">Patches</div>
    <div id="patches" class="grid"></div>

    <div class="category-header">Throwback</div>
    <div id="throwback" class="grid"></div>

    <div class="category-header">Theme Night Logos</div>
    <div id="theme-night"></div>
    
    <div class="category-header">Copa de la Diversión Logos</div>
    <div id="copa"></div>

    <div class="category-header">Batting Practice</div>
    <div id="batting-practice" class="grid"></div>

    <div class="category-header">Other</div>
    <div id="other-logos" class="grid"></div>
    
    <script>
        const path = "../../images/triple-a-teams/fresno-grizzlies/";
// THROWBACK_GROUPS v2: grouped by the year of the design, then by the year worn
const throwbackFiles = [];
function queueThrowback(fileName) { throwbackFiles.push(fileName); }
document.addEventListener('DOMContentLoaded', () => {
    const section = document.getElementById('throwback');
    if (!section || !throwbackFiles.length) return;
    section.classList.remove('grid');
    const groups = new Map();          // design year -> Map(years worn -> [cards])
    for (const fileName of throwbackFiles) {
        const base = fileName.replace(/\.png$/i, '');
        const end = base.match(/\s(\d{4}(?:-(?:\d{4}|present))?(?:,\s*\d{4}(?:-(?:\d{4}|present))?)*)\s*$/i);
        const namePart = end ? base.slice(0, end.index) : base;
        const worn = end ? end[1] : '';
        const design = namePart.match(/\b(\d{4}s?)\b/);
        const key = design ? design[1] : '';
        let label = namePart.replace(design ? design[1] : '', '').replace(/throwback/gi, '')
            .replace(/logo\d*/gi, '').replace(/\s+/g, ' ').trim();
        label = label ? label[0].toUpperCase() + label.slice(1) : '';
        const card = `
        <div class="logo-card" onclick="openLightbox('${path}${fileName}')">
            <div class="logo-image-wrapper">
                <img src="${path}${fileName}" alt="${base}" loading="lazy">
            </div>
            <div class="logo-caption">
                <div class="logo-name">${label}</div>
            </div>
        </div>`;
        if (!groups.has(key)) groups.set(key, new Map());
        const rows = groups.get(key);
        if (!rows.has(worn)) rows.set(worn, []);
        rows.get(worn).push(card);
    }
    const byYear = (a, b) => (a === '') - (b === '') || parseInt(a) - parseInt(b) || a.localeCompare(b);
    section.innerHTML = [...groups.keys()].sort(byYear).map(k =>
        `\n    <h3 class="identity-header">${k ? k + ' throwback' : 'Other throwbacks'}</h3>` +
        [...groups.get(k).keys()].sort(byYear).map(w => `
    <div class="year-row-label">${w}</div>
    <div class="grid">${groups.get(k).get(w).join('')}</div>`).join('')
    ).join('');
});
// Years shown = only the years at the end of the file name; the rest is the name
const YEARS_AT_END = /\s(\d{4}(?:-(?:\d{4}|present))?(?:,\s*\d{4}(?:-(?:\d{4}|present))?)*)\s*$/i;
function splitYears(fileName) {
    const base = fileName.replace(/\.png$/i, '');
    const m = base.match(YEARS_AT_END);
    return m ? { name: base.slice(0, m.index), years: m[1] } : { name: base, years: '' };
}
function labelFrom(name) {
    return name.replace(/logo\d*/gi, '').replace(/alternate/gi, '').replace(/,/g, '')
               .replace(/\s+/g, ' ').replace(/^-+|-+$/g, '').trim();
}
        const allFiles = [
"Alt black hat logo 2008-2018.png",
"Alt black jersey logo 2008-2014.png",
"Alt black jersey logo 2015-2018.png",
"Alt G hat logo 2015-2018.png",
"Alternate flag logo 2019-2020.png",
"Alternate logo 2019-2020.png",
"Black jersey logo 2019-2020.png",
"Cream jersey logo 2019-2020.png",
"Flag hat logo 2019-2020.png",
"Gold bear hat logo 2019-2020.png",
"Home black hat logo 2008-2018.png",
"Home red hat logo 2019-2020.png",
"Home white jersey logo 2008-2014.png",
"Home white jersey logo 2015-2018.png",
"Primary logo 2008-2018.png",
"Primary logo 2019-2020.png",
"Red jersey logo 2019-2020.png",
"Road black hat logo 2008-2018.png",
"Road black hat logo 2019-2020.png",
"Road gray jersey logo 2019-2020.png",
];

allFiles.sort((a, b) => {
    const getSortData = (file) => {
        const lower = file.toLowerCase();
        
        // Identity Extraction (for grouping Dukes together, Isotopes together, etc.)
        let identity = "";
        if (lower.includes("theme night")) identity = lower.split("theme night")[0].trim();
        else if (lower.includes("copa")) identity = lower.split("copa")[0].trim();

        // Year Extraction (Start Year)
        const yearMatch = (splitYears(file).years || file).match(/\d{4}/);
        const startYear = yearMatch ? parseInt(yearMatch[0]) : 0;
        
        // Active/Present Priority (Forces 'present' to the bottom of the group)
        const activePriority = lower.includes("present") ? 1 : 0;
        
        // Type Order (Hat -> Jersey -> Patch)
        let typePriority = 99; 
        if (lower.includes("hat")) typePriority = 1;
        else if (lower.includes("jersey")) typePriority = 2;
        else if (lower.includes("patch") || lower.includes("sleeve")) typePriority = 3;

        return { identity, activePriority, startYear, typePriority };
    };

    const A = getSortData(a);
    const B = getSortData(b);

    // SORTING HIERARCHY:
    // 1. Group by Identity Name (Alphabetical: Dukes, then Green Chile...)
    // 2. Group by Active status (0 for past years, 1 for 'present')
    // 3. Group by Start Year (2017 before 2018)
    // 4. Group by Type (Hat, Jersey, Patch)
    return A.activePriority - B.activePriority || // 1. Past years first
       A.startYear - B.startYear ||           // 2. Oldest years first (e.g., 2012 before 2017)
       A.identity.localeCompare(B.identity) || // 3. Alphabetical identity if years are the same
       A.typePriority - B.typePriority;        // 4. Hat -> Jersey -> Patch
});

const printedIdentities = new Set();

allFiles.forEach(fileName => {
    const lowerName = fileName.toLowerCase();
    const datePattern = /\d{4}(?:-\d{4}|-present)?/g;
    const yearMatch = fileName.match(datePattern);
    const yearText = splitYears(fileName).years || (yearMatch ? yearMatch[0] : "");

    let identity = "";
    if (lowerName.includes("theme night")) identity = fileName.split(/theme night/i)[0].trim();
    else if (lowerName.includes("copa")) identity = fileName.split(/copa/i)[0].trim();

    // Clean caption for the card
    let cardCaption = fileName
        .replace('.png', '')
        .replace(yearText, '')
        .replace(/theme night|copa/gi, '')
        .replace(/logo/gi, '')
        .replace(/\s+/g, ' ')
        .trim();

    // --- VERSION A: Clean card for Theme/Copa (No year inside) ---
    const cleanCardHtml = `
        <div class="logo-card" onclick="openLightbox('${path}${fileName}')">
            <div class="logo-image-wrapper">
                <img src="${path}${fileName}" loading="lazy">
            </div>
            <div class="logo-caption">
                <div class="logo-name">${cardCaption}</div>
            </div>
        </div>`;

    // --- VERSION B: Standard card for Primary/Alternate/Other (Includes year) ---
    const standardCardHtml = `
        <div class="logo-card" onclick="openLightbox('${path}${fileName}')">
            <div class="logo-image-wrapper">
                <img src="${path}${fileName}" loading="lazy">
            </div>
            <div class="logo-caption">
                <div class="logo-name">${cardCaption}</div>
                <div class="logo-year">${yearText}</div>
            </div>
        </div>`;

    // 3. SORTING MACHINE
    if (lowerName.includes("theme night") || lowerName.includes("copa")) {
        const targetId = lowerName.includes("theme night") ? 'theme-night' : 'copa';
        const container = document.getElementById(targetId);
        const groupKey = `${identity}-${yearText}`.replace(/\s+/g, '-');

        if (!printedIdentities.has(identity)) {
            printedIdentities.add(identity);
            container.innerHTML += `
    <h3 class="identity-header">${identity}</h3>`;
        }

        if (!document.getElementById(`grid-${groupKey}`)) {
            container.innerHTML += `
                <div class="year-row-label">${yearText}</div>
                <div id="grid-${groupKey}" class="grid"></div>`;
        }
        // Use the CLEAN card here because the year is already in the row label
        document.getElementById(`grid-${groupKey}`).innerHTML += cleanCardHtml;
    } else {
        // Use the STANDARD card here so the years appear underneath the name
        let targetGrid;
        if (lowerName.includes("throwback")) { queueThrowback(fileName); return; }
        if (lowerName.includes("primary logo")) targetGrid = 'primary-logos';
        else if (lowerName.includes("alternate")) targetGrid = 'alternate-logos';
        else if (lowerName.includes("batting practice")) targetGrid = 'batting-practice';
        else if (lowerName.includes("hat")) targetGrid = 'hat-logos';
        else if (lowerName.includes("jersey")) targetGrid = 'jersey-logos';
        else if (lowerName.includes("patch")) targetGrid = 'patches';
        else targetGrid = 'other-logos';
        
        document.getElementById(targetGrid).innerHTML += standardCardHtml;
    }
});

function openLightbox(imgSrc) {
    document.getElementById('lightbox-img').src = imgSrc;
    document.getElementById('lightbox').style.display = 'flex';
}
</script>
  
  <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
    <span class="close-btn">&times;</span>
    <img id="lightbox-img" src="" alt="Enlarged Logo">
    <div id="lightbox-caption"></div>
</div>

</body>
</html>
