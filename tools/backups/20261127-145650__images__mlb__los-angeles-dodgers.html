    <script>
        const path = "../../images/mlb-teams/los-angeles-dodgers/";
// NEGRO_LEAGUE_GROUPS v3: grouped by "<design year> <team>", ordered by when the MLB team wore it
const negroLeagueFiles = [];
function queueNegroLeague(fileName) { negroLeagueFiles.push(fileName); }
document.addEventListener('DOMContentLoaded', () => {
    const section = document.getElementById('negro-league');
    if (!section || !negroLeagueFiles.length) return;
    section.classList.remove('grid');
    const ELEMENT = /\b(home|road|alt|alternate|batting|sleeve|jersey|hat|cap|helmet|patch|pants?|socks?)\b/i;
    const tidy = t => t.replace(/logo\d*/gi, '').replace(/\s+/g, ' ').trim();
    const groups = new Map();          // team -> Map(years worn -> [cards])
    for (const fileName of negroLeagueFiles) {
        const base = fileName.replace(/\.png$/i, '');
        const end = base.match(/\s(\d{4}(?:-(?:\d{4}|present))?(?:,\s*\d{4}(?:-(?:\d{4}|present))?)*)\s*$/i);
        const namePart = end ? base.slice(0, end.index) : base;
        const worn = end ? end[1] : '';
        const nl = namePart.match(/negro leagues?/i);
        let team = '', label = namePart;
        if (nl) {
            const before = tidy(namePart.slice(0, nl.index));
            const after = tidy(namePart.slice(nl.index + nl[0].length));
            if (before) { team = before; label = after; }
            else {
                const el = after.match(ELEMENT);
                team = tidy(el ? after.slice(0, el.index) : '');
                label = el ? after.slice(el.index) : after;
            }
        }
        // The design year (in the name, not the years worn at the end) goes first in the heading
        const yr = (team + ' ' + label).match(/\b(\d{4}s?)\b/);
        if (yr) { team = tidy(team.replace(yr[1], '')); label = label.replace(yr[1], ''); }
        team = team ? team[0].toUpperCase() + team.slice(1) : '';
        team = [yr ? yr[1] : '', team].join(' ').trim();
        label = tidy(label);
        label = label ? label[0].toUpperCase() + label.slice(1) : '';
        const card = `
        <div class="logo-card" onclick="openLightbox('${path}${fileName}')">
            <div class="logo-image-wrapper">
                <img src="${path}${fileName}" alt="${base}" loading="lazy">
            </div>
            <div class="logo-caption">
                <div class="logo-name">${label}</div>
            </div>
        </div>`;
        if (!groups.has(team)) groups.set(team, new Map());
        const rows = groups.get(team);
        if (!rows.has(worn)) rows.set(worn, []);
        rows.get(worn).push(card);
    }
    const byYear = (a, b) => (a === '') - (b === '') || parseInt(a) - parseInt(b) || a.localeCompare(b);
    // Groups are listed by the first year the MLB team wore them; ties by design year, then name
    const firstWorn = t => Math.min(...[...groups.get(t).keys()].map(w => parseInt(w) || Infinity));
    const designYear = t => { const m = t.match(/^(\d{4})/); return m ? parseInt(m[1]) : Infinity; };
    const byTeam = (a, b) => (a === '') - (b === '') || firstWorn(a) - firstWorn(b)
        || designYear(a) - designYear(b) || a.localeCompare(b);
    section.innerHTML = [...groups.keys()].sort(byTeam).map(t =>
        `\n    <h3 class="identity-header">${t || 'Other'}</h3>` +
        [...groups.get(t).keys()].sort(byYear).map(w => `
    <div class="year-row-label">${w}</div>
    <div class="grid">${groups.get(t).get(w).join('')}</div>`).join('')
    ).join('');
});
// HOLIDAY_GROUPS v1: the Holiday section is grouped by holiday, then by the year worn
const HOLIDAY_LIST = [["Chinese New Year", "chinese new year"], ["Lunar New Year", "lunar new year"], ["Mardi Gras", "mardi gras"], ["St. Patrick's Day", "st\\.? ?patrick'?s?(?: day)?"], ["Mother's Day", "mother'?s?(?: day)?"], ["Armed Forces", "armed forces(?: day| weekend)?"], ["Memorial Day", "memorial day"], ["Father's Day", "father'?s?(?: day)?"], ["4th of July", "(?:4th of )?july|independence day"], ["Noche Latina", "noche latina"], ["Military", "military(?: appreciation)?"], ["Christmas", "christmas"]];
const holidayFiles = [];
function queueHoliday(fileName) { holidayFiles.push(fileName); }
document.addEventListener('DOMContentLoaded', () => {
    const section = document.getElementById('holiday');
    if (!section || !holidayFiles.length) return;
    section.classList.remove('grid');
    const groups = new Map();          // holiday index -> Map(years worn -> [cards])
    for (const fileName of holidayFiles) {
        const base = fileName.replace(/\.png$/i, '');
        const end = base.match(/\s(\d{4}(?:-(?:\d{4}|present))?(?:,\s*\d{4}(?:-(?:\d{4}|present))?)*)\s*$/i);
        const namePart = end ? base.slice(0, end.index) : base;
        const worn = end ? end[1] : '';
        let idx = HOLIDAY_LIST.findIndex(h => new RegExp(h[1], 'i').test(namePart));
        let label = namePart;
        if (idx >= 0) label = label.replace(new RegExp(HOLIDAY_LIST[idx][1], 'i'), '');
        else idx = HOLIDAY_LIST.length;
        label = label.replace(/logo\d*/gi, '').replace(/\s+/g, ' ').trim();
        label = label ? label[0].toUpperCase() + label.slice(1) : '';
        const card = `
        <div class="logo-card" onclick="openLightbox('${path}${fileName}')">
            <div class="logo-image-wrapper">
                <img src="${path}${fileName}" alt="${base}" loading="lazy">
            </div>
            <div class="logo-caption">
                <div class="logo-name">${label}</div>
            </div>
        </div>`;
        if (!groups.has(idx)) groups.set(idx, new Map());
        const rows = groups.get(idx);
        if (!rows.has(worn)) rows.set(worn, []);
        rows.get(worn).push(card);
    }
    const byYear = (a, b) => (a === '') - (b === '') || parseInt(a) - parseInt(b) || a.localeCompare(b);
    section.innerHTML = [...groups.keys()].sort((a, b) => a - b).map(i =>
        `\n    <h3 class="identity-header">${i < HOLIDAY_LIST.length ? HOLIDAY_LIST[i][0] : 'Other'}</h3>` +
        [...groups.get(i).keys()].sort(byYear).map(w => `
    <div class="year-row-label">${w}</div>
    <div class="grid">${groups.get(i).get(w).join('')}</div>`).join('')
    ).join('');
});
// THROWBACK_GROUPS v2: grouped by the year of the design, then by the year worn
const throwbackFiles = [];
function queueThrowback(fileName) { throwbackFiles.push(fileName); }
document.addEventListener('DOMContentLoaded', () => {
    const section = document.getElementById('throwback');
    if (!section || !throwbackFiles.length) return;
    section.classList.remove('grid');
    const groups = new Map();          // design year -> Map(years worn -> [cards])
    for (const fileName of throwbackFiles) {
        const base = fileName.replace(/\.png$/i, '');
        const end = base.match(/\s(\d{4}(?:-(?:\d{4}|present))?(?:,\s*\d{4}(?:-(?:\d{4}|present))?)*)\s*$/i);
        const namePart = end ? base.slice(0, end.index) : base;
        const worn = end ? end[1] : '';
        const design = namePart.match(/\b(\d{4}s?)\b/);
        const key = design ? design[1] : '';
        let label = namePart.replace(design ? design[1] : '', '').replace(/throwback/gi, '')
            .replace(/logo\d*/gi, '').replace(/\s+/g, ' ').trim();
        label = label ? label[0].toUpperCase() + label.slice(1) : '';
        const card = `
        <div class="logo-card" onclick="openLightbox('${path}${fileName}')">
            <div class="logo-image-wrapper">
                <img src="${path}${fileName}" alt="${base}" loading="lazy">
            </div>
            <div class="logo-caption">
                <div class="logo-name">${label}</div>
            </div>
        </div>`;
        if (!groups.has(key)) groups.set(key, new Map());
        const rows = groups.get(key);
        if (!rows.has(worn)) rows.set(worn, []);
        rows.get(worn).push(card);
    }
    const byYear = (a, b) => (a === '') - (b === '') || parseInt(a) - parseInt(b) || a.localeCompare(b);
    section.innerHTML = [...groups.keys()].sort(byYear).map(k =>
        `\n    <h3 class="identity-header">${k ? k + ' throwback' : 'Other throwbacks'}</h3>` +
        [...groups.get(k).keys()].sort(byYear).map(w => `
    <div class="year-row-label">${w}</div>
    <div class="grid">${groups.get(k).get(w).join('')}</div>`).join('')
    ).join('');
});
// Years shown = only the years at the end of the file name; the rest is the name
const YEARS_AT_END = /\s(\d{4}(?:-(?:\d{4}|present))?(?:,\s*\d{4}(?:-(?:\d{4}|present))?)*)\s*$/i;
function splitYears(fileName) {
    const base = fileName.replace(/\.png$/i, '');
    const m = base.match(YEARS_AT_END);
    return m ? { name: base.slice(0, m.index), years: m[1] } : { name: base, years: '' };
}
function labelFrom(name) {
    return name.replace(/logo\d*/gi, '').replace(/alternate/gi, '').replace(/,/g, '')
               .replace(/\s+/g, ' ').replace(/^-+|-+$/g, '').trim();
}
        const allFiles = [

allFiles.sort((a, b) => {
    const getLastYear = (fileName) => {
        const lower = fileName.toLowerCase();
        
        if (lower.includes("present")) return 9999;

        const years = fileName.match(/\d{4}/g);
        if (years && years.length > 0) {
            return parseInt(years[years.length - 1]);
        }
        
        return 0;
    };

    return getLastYear(a) - getLastYear(b);
});     
function openLightbox(imgSrc) {
    document.getElementById('lightbox-img').src = imgSrc;
    document.getElementById('lightbox').style.display = 'flex';
}

allFiles.forEach(fileName => {
           let fullName = fileName.replace('logo ', '').replace('.png', '');
           const datePattern = /\d{4}(?:-\d{4}|-present)?/g; 
    const matches = fullName.match(datePattern);
    const yearText = matches ? matches.join(', ') : "";
    let nameWithoutYear = fullName;
    if (matches) {
        matches.forEach(m => {
            nameWithoutYear = nameWithoutYear .replace(m, '')
            .replace(/alternate/gi, '')
                                     .replace(/logo\d*/gi, '')
                                     .replace(/,/g, '')
                                     .trim();
        });
    }
    nameWithoutYear = nameWithoutYear.replace(/^-+|-+$/g, '').trim();
    const shown = splitYears(fileName);
    const shownYears = shown.years || yearText;
    const shownName = labelFrom(shown.name);
    const cardHtml = `
    <div class="logo-card" onclick="openLightbox('${path}${fileName}')">
        <div class="logo-image-wrapper">
            <img src="${path}${fileName}" alt="${fullName}" loading="lazy">
        </div>
        <div class="logo-caption">
            ${nameWithoutYear ? `<div class="logo-name">${shownName}</div>` : ''}
            <div class="logo-year">${shownYears}</div>
        </div>
    </div>`;
    const lowerName = fileName.toLowerCase();

    if (lowerName.includes("mother") || 
        lowerName.includes("father") || 
        lowerName.includes("july") || 
        lowerName.includes("memorial day") ||
        lowerName.includes("armed forces") || 
        lowerName.includes("st. patrick")) {
        queueHoliday(fileName);
    }
    else if (lowerName.includes("spring training")) {
        document.getElementById('spring-training').innerHTML += cardHtml;
    } 
    else if ((lowerName.includes("throwback") && !lowerName.includes("throwback weekend"))) {
        queueThrowback(fileName);
    }
    else if (lowerName.includes("negro league")) {
        queueNegroLeague(fileName);
    }
    else if (lowerName.includes("primary logo")) {
        document.getElementById('primary-logos').innerHTML += cardHtml;
    } 
    else if (lowerName.includes("alternate")) {
        document.getElementById('alternate-logos').innerHTML += cardHtml;
    } 
    else if (lowerName.includes("batting practice")) {
        document.getElementById('batting-practice').innerHTML += cardHtml;
    } 
    else if ((lowerName.includes("jersey") && !/pattern|texture|gradient/.test(lowerName))) {
        document.getElementById('jersey-logos').innerHTML += cardHtml;
    } 
    else if ((lowerName.includes("hat") && !/pattern|texture|gradient/.test(lowerName))) {
        document.getElementById('hat-logos').innerHTML += cardHtml;
    } 
    else if (lowerName.includes("patch")) {
        document.getElementById('patches').innerHTML += cardHtml;
    } 
    else {
        document.getElementById('other-logos').innerHTML += cardHtml;
    }
});
